  <title>Disney Ride Display</title>

  <style>
        
    body {
      background: #222;
      margin: 0;
      font-family: Arial;
    }
    
    /* 4:3 iPad-like frame */
    #frame {
      width: 1024px;
      height: 768px;
      background: #000;
      margin: auto;
      position: relative;
      color: white;
      padding: 40px;
      box-sizing: border-box;
    }
    
    /* Main content LEFT aligned */
    #content {
      width: 700px;
    }
    
    /* Title */
    #name {
      font-size: 44px;
      margin-bottom: 12px;
    }
    
    /* Subtitle */
    #land {
      font-size: 20px;
      color: #ccc;
      margin-bottom: 25px;
    }
    
    /* Row: image + wait */
    #mainRow {
      display: flex;
      align-items: center; /* vertical alignment with image */
    }
    
    /* Image (7:5 ratio) */
    #image {
      width: 700px;
      height: 500px; /* 7:5 ratio */
      object-fit: cover;
    }
    
    /* Wait block */
    #waitBlock {
      margin-left: 50px;
      text-align: center;
    }
    
    /* Big number */
    #waitNumber {
      font-size: 110px;
      font-weight: 300;
    }
    
    /* Label */
    #waitLabel {
      font-size: 20px;
      margin-top: 5px;
    }
    
    /* Sidebar */
    #sidebar {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 140px;
      color: #aaa;
      font-size: 14px;
      text-align: left;
    }
    
    /* Sidebar header */
    .sidebar-title {
      margin-bottom: 10px;
    }
    
    /* Closed ride */
    .closed-ride {
      margin-bottom: 4px;
    }
    
    /* Closed parks (bold at bottom) */
    .closed-park {
      font-weight: bold;
      margin-top: 8px;
    }

  </style>

// store rides
var rideList = [];

// fetch all parks
function fetchTimes() {
  var urls = [
    "https://queue-times.com/parks/6/queue_times.json", // Magic Kingdom
    "https://queue-times.com/parks/7/queue_times.json", // Hollywood Studios
    "https://queue-times.com/parks/8/queue_times.json", // Animal Kingdom
    "https://queue-times.com/parks/5/queue_times.json", // EPCOT
    "https://queue-times.com/parks/16/queue_times.json", // Disneyland Park
    "https://queue-times.com/parks/17/queue_times.json" // California Adventure
  ];

  var results = [];
  var completed = 0;

  urls.forEach(function(url, index) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", proxy + encodeURIComponent(url), true);

    xhr.onload = function() {
      if (xhr.status === 200) {
        results[index] = JSON.parse(xhr.responseText);
      }

      completed++;

      if (completed === urls.length) {
        process(results);
      }
    };

    xhr.send();
  });
}


// build ordered list
function process(allData) {
  rideList = [];
  var closedRides = [];
  var parkTotals = {};
  var parkClosed = {};
  allData.forEach(function(data) {
    if (!data || !data.lands) return;
    data.lands.forEach(function(land) {
      land.rides.forEach(function(ride) {
        var mappedLand = rideToLand[ride.id];
        var park = rideToPark[ride.id];
        if (!mappedLand || !park) return;
        // initialize counters
        if (!parkTotals[park]) {
          parkTotals[park] = 0;
          parkClosed[park] = 0;
        }
        parkTotals[park]++;
        if (ride.is_open) {
          rideList.push({
            id: ride.id,
            name: ride.name,
            land: mappedLand,
            wait: ride.wait_time
          });
        } else {
          closedRides.push({
            id: ride.id,
            name: ride.name,
            land: mappedLand
          });
          parkClosed[park]++;
        }
      });
    });
  });
  
  // Determine fully closed parks
  var closedParks = [];
  Object.keys(parkTotals).forEach(function(park) {
    if (parkTotals[park] > 0 && parkTotals[park] === parkClosed[park]) {
      closedParks.push(park);
    }
  });

  // remove rides in the closed section that are in closed parks  
  var filteredClosedRides = closedRides.filter(function(ride) {
    var park = rideToPark[ride.id];
    return closedParks.indexOf(park) === -1;
  });
  
  renderClosed(filteredClosedRides, closedParks);

}


function renderClosed(closedRides, closedParks) {
  var listContainer = document.getElementById("closedList");
  var parksContainer = document.getElementById("closedParks");

  listContainer.innerHTML = "";
  parksContainer.innerHTML = "";
  // Closed rides
  closedRides.forEach(function(ride) {
    var div = document.createElement("div");
    div.className = "closed-ride";
    var name = closedRideNames[ride.id] || ride.name;
    div.innerText = name;
    listContainer.appendChild(div);
  });
  // Closed parks
  if (closedParks.length > 0) {
    var divider = document.createElement("div");
    divider.style.marginTop = "15px";
    divider.style.borderTop = "1px solid #444";
    listContainer.appendChild(divider);
    closedParks.forEach(function(park) {
      var div = document.createElement("div");
      div.className = "closed-park";
      div.innerText = park;
      parksContainer.appendChild(div);
    });
  }
}

// display one ride
function showNext() {
  if (rideList.length === 0) return;
  var ride = rideList[currentIndex];
  document.getElementById("name").innerText = ride.name;
  document.getElementById("land").innerText = ride.land;

  // wait display
  if (ride.wait === "Closed") {
    document.getElementById("waitNumber").innerText = "--";
    document.getElementById("waitLabel").innerText = "Closed";
    document.getElementById("waitNumber").style.color = "#888";
  } else {
    var waitNum =ride.wait;
    document.getElementById("waitNumber").innerText = waitNum;
    document.getElementById("waitLabel").innerText = "minutes";

    // color coding
    var color;
    if (waitNum <= 10) color = "green";
    else if (waitNum <= 20) color = "lightgreen";
    else if (waitNum <= 40) color = "yellow";
    else if (waitNum <= 55) color = "orange";
    else color = "#f4b400";

    document.getElementById("waitNumber").style.color = color;
  }

  // image
  var img = rideImages[ride.id] || "images/default.jpg";
  document.getElementById("image").src = img;

  currentIndex++;
  if (currentIndex >= rideList.length) {
    currentIndex = 0;
  }
}


// refresh data every minute
fetchTimes();
setInterval(fetchTimes, 60000);

// rotate display every 5 seconds
function startRotation() {
  showNext();

  setTimeout(startRotation, 5000);
}
setTimeout(startRotation, 1000);
