<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Disney Ride Display</title>

  <style>
        
    body {
      background: #222;
      margin: 0;
      font-family: Arial;
    }
    
    /* 4:3 iPad-like frame */
    #frame {
      width: 1024px;
      height: 768px;
      background: #000;
      margin: auto;
      position: relative;
      color: white;
      padding: 40px;
      box-sizing: border-box;
    }
    
    /* Main content LEFT aligned */
    #content {
      width: 900px;
      overflow: hidden;
      position: relative;
    }

    /* Title */
    #name {
      font-size: 44px;
      margin-bottom: 12px;
    }
    
    /* Subtitle */
    .land {
      font-size: 24px;
      color: #ccc;
      margin-bottom: 25px;
    }
    
    /* Row: image + wait */
    #mainRow {
      display: flex;
      align-items: center; /* vertical alignment with image */
    }
    
    /* Image */
    .image {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

    #imageFlip {
      width: 700px;
      height: 500px;
    }
    
    #imageFlip .flip-inner {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    #imageFlip .flip-front,
    #imageFlip .flip-back {
      width: 100%;
      height: 100%;
      position: absolute;
    }

    /* Wait block */
    #waitBlock {
      margin-left: 60px;
      text-align: center;
      width: 210px;
    }
    
    /* Big number */
    .waitNumber {
      font-size: 110px;
      font-weight: 300;
    }
    
    /* Label */
    #waitLabel {
      width: 100%;
      font-size: 20px;
      margin-top: 5px;
    }
    
    #waitFlip {
      width: 100%;
      height: 120px; /* or 110–130 depending on preference */
      position: relative;
    }
    
    #waitFlip .flip-front,
    #waitFlip .flip-back {
      width: 100%;
      text-align: center;
    }
    
    /* Sidebar */
    #sidebar {
      position: absolute;
      top: 40px;
      left: 800px;
      width: 180px;
      color: #aaa;
      font-size: 14px;
      text-align: left;
    }
    
    /* Sidebar header */
    .sidebar-title {
      margin-bottom: 10px;
    }
    
    /* Closed ride */
    .closed-ride {
      margin-bottom: 4px;
    }
    
    /* Closed parks (bold at bottom) */
    .closed-park {
      font-weight: bold;
      margin-top: 8px;
    }
 
    .flip-container {
      perspective: 1000px;
      margin-bottom: 10px;
      position: relative;
    }
    
    .flip-inner {
      position: relative; 
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.25, 1.5, 0.5, 1);
    }
    
    .flip-front, .flip-back {
      position: absolute;
      top: 0;
      left: 0;
      backface-visibility: hidden;
    }

    /* inherit styling so front/back look identical */
    .flip-front,
    .flip-back {
      font: inherit;
      color: inherit;
    }
    
    /* front stays normal */
    .flip-front {
      transform: rotateX(0deg);
      position: relative;
    }
    
    /* back starts hidden behind */
    .flip-back {
      transform: rotateX(90deg);
      transition: transform 0.15s ease;
    }
    
    /* image uses 180-degree flip instead */
    #imageFlip .flip-back,
    .flip-back.image {
      transform: rotateX(180deg);
    }

    /* special behavior for image flip */
    .image-flip-mode {
      transform-origin: center center;
    }
    
    /* Specific sizing */
    .name { font-size: 44px; margin-bottom: 12px;}
    .waitNumber { font-size: 110px; font-weight: 300; }
    .image {
      width: 700px;
      height: 500px;
      object-fit: cover;
    }
    
    /* Dislike UI container */
    #dislikeContainer {
      position: absolute;
      left: 0px;
      top: 600px;
    }
    
    /* Button */
    #dislikeButton {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 8px 12px;
      cursor: pointer;
    }
    
    /* Dropdown (drop UP) */
    #dislikeMenu {
      position: absolute;
      bottom: 40px;
      right: 0;
      width: 260px;
      max-height: 500px;
      overflow-y: auto;
      background: #111;
      border: 1px solid #555;
      display: none;
    }
    
    /* Each row */
    .dislike-item {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid #333;
    }
    
    .dislike-item label {
      margin-left: 6px;
      font-size: 13px;
    }

  </style>
</head>

          <div class="flip-back waitNumber"></div>
        </div>
      </div>

      <div id="waitLabel">minutes</div>
    </div>
  </div>
    
  <!-- Disliked Rides UI -->
  <div id="dislikeContainer">
    <button id="dislikeButton">Disliked Rides</button>
    <div id="dislikeMenu">
      <div id="dislikeList"></div>
    </div>
  </div>

</div>

// store rides
var rideList = [];
var currentIndex = 0;

// build dislike menu
function buildDislikeMenu() {
  var container = document.getElementById("dislikeList");
  container.innerHTML = "";

  // loop through closedRideNames (correct order)
  Object.keys(closedRideNames).forEach(function(id) {

    var item = document.createElement("div");
    item.className = "dislike-item";

    var checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = id;

    var label = document.createElement("label");
    label.innerText = closedRideNames[id];

    item.appendChild(checkbox);
    item.appendChild(label);
    container.appendChild(item);
  });
}

// fetch all parks
function fetchTimes() {
  var urls = [
    "https://queue-times.com/parks/6/queue_times.json", // Magic Kingdom
    "https://queue-times.com/parks/7/queue_times.json", // Hollywood Studios
    "https://queue-times.com/parks/8/queue_times.json", // Animal Kingdom
    "https://queue-times.com/parks/5/queue_times.json", // EPCOT
    "https://queue-times.com/parks/16/queue_times.json", // Disneyland Park
    "https://queue-times.com/parks/17/queue_times.json" // California Adventure
  ];

  var results = [];
  var completed = 0;

  urls.forEach(function(url, index) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", proxy + encodeURIComponent(url), true);

    xhr.onload = function() {
      if (xhr.status === 200) {
        results[index] = JSON.parse(xhr.responseText);
      }

      completed++;

      if (completed === urls.length) {
        process(results);
      }
    };

    xhr.send();
  });
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// build ordered list

function process(allData) {

  // FIRST LOAD: build the list
  if (!hasInitialized) {
    var closedRides = [];
    var parkTotals = {};
    var parkClosed = {};
    allData.forEach(function(data) {
      if (!data || !data.lands) return;
      data.lands.forEach(function(land) {
        land.rides.forEach(function(ride) {
          var mappedLand = rideToLand[ride.id];
          var park = rideToPark[ride.id];
          if (!mappedLand || !park) return;
          if (dislikedRideIDs.indexOf(ride.id) !== -1) return;
          // initialize park counters
          if (!parkTotals[park]) {
            parkTotals[park] = 0;
            parkClosed[park] = 0;
          }
          parkTotals[park]++;
          var wait = ride.is_open ? ride.wait_time : 999;
          if (!ride.is_open) {
            if (dislikedRideIDs.indexOf(ride.id) !== -1) return;
            closedRides.push({
              id: ride.id,
              name: ride.name,
              land: mappedLand
            });
            parkClosed[park]++;
          }
          rideList.push({
            id: ride.id,
            name: rideDisplayNames[ride.id] || ride.name,
            land: mappedLand,
            wait: wait
          });
        });
      });
    });

    // Separate favorites from main list
    var favorites = [];
    var nonFavorites = [];
    rideList.forEach(function(ride) {
      if (favoriteRideIDs.indexOf(ride.id) !== -1) {
        favorites.push(ride);
      } else {
        nonFavorites.push(ride);
      }
    });
        
    shuffleArray(nonFavorites); // Shuffle ONLY non-favorites
    
    // Rebuild rideList with insertion pattern
    var newList = [];
    var chunkSize = 10; // CONTROLS how many random rides go between favorites
    var index = 0;
    while (index < nonFavorites.length) {  
      // add up to 10 random rides
      for (let i = 0; i < chunkSize && index < nonFavorites.length; i++) {
        newList.push(nonFavorites[index]);
        index++;
      }
      // insert favorites (if any exist)
      if (favorites.length > 0) {
        favorites.forEach(function(fav) {
          newList.push(fav);
        });
      }
    }
    rideList = newList;

    hasInitialized = true;
    renderClosed(closedRides, []);
    return;
  }

  // SUBSEQUENT LOADS: update waits only
  var closedRides = [];
  var parkTotals = {};
  var parkClosed = {};
  allData.forEach(function(data) {
    if (!data || !data.lands) return;
    data.lands.forEach(function(land) {
      land.rides.forEach(function(ride) {
        var mappedLand = rideToLand[ride.id];
        var park = rideToPark[ride.id];
        if (!mappedLand || !park) return;
        if (!parkTotals[park]) {
          parkTotals[park] = 0;
          parkClosed[park] = 0;
        }
        parkTotals[park]++;
        var wait = ride.is_open ? ride.wait_time : 999;
        // find ride in existing list
        var existing = rideList.find(r => r.id === ride.id);
        if (existing) {
          existing.wait = wait;
        }
        if (!ride.is_open) {
          if (dislikedRideIDs.indexOf(ride.id) !== -1) return;
          closedRides.push({
            id: ride.id,
            name: ride.name,
            land: mappedLand
          });
          parkClosed[park]++;
        }
      });
    });
  });
  renderClosed(closedRides, []);
}

function renderClosed(closedRides, closedParks) {
  var listContainer = document.getElementById("closedList");
  var parksContainer = document.getElementById("closedParks");

  listContainer.innerHTML = "";
  parksContainer.innerHTML = "";
  // Closed rides
  closedRides.forEach(function(ride) {
    var div = document.createElement("div");
    div.className = "closed-ride";
    var name = closedRideNames[ride.id] || ride.name;
    div.innerText = name;
    listContainer.appendChild(div);
  });
  // Closed parks
  if (closedParks.length > 0) {
    var divider = document.createElement("div");
    divider.style.marginTop = "15px";
    divider.style.borderTop = "1px solid #444";
    listContainer.appendChild(divider);
    closedParks.forEach(function(park) {
      var div = document.createElement("div");
      div.className = "closed-park";
      div.innerText = park;
      parksContainer.appendChild(div);
    });
  }
}

// display one ride

function flipElement(containerId, newValue, isImage) {
  var container = document.getElementById(containerId);
  var inner = container.querySelector(".flip-inner");
  var front = container.querySelector(".flip-front");
  var back = container.querySelector(".flip-back");
  // set back content

  if (isImage) {
    var imgLoader = new Image();
    imgLoader.onload = function() {
      back.src = newValue;
      // enable center rotation
      inner.classList.add("image-flip-mode");
      // rotate full 180 instead of 90
      inner.style.transition = "transform 0.55s cubic-bezier(0.25, 1.5, 0.5, 1)";
      inner.style.transform = "rotateX(-180deg)";
      setTimeout(function() {
        front.src = newValue;
        // reset instantly
        inner.style.transition = "none";
        inner.style.transform = "rotateX(0deg)";
        inner.classList.remove("image-flip-mode");
      }, 550);
    };
    imgLoader.src = newValue;
    return;

  } else {
    if (containerId === "waitFlip") {
      newValue = formatWait(newValue);
      var color = getWaitColor(newValue);
      back.style.color = color;
      front.style.color = color;
    }
    back.innerText = newValue;
  }
  // animate down
  inner.style.transition = "transform 0.55s cubic-bezier(0.25, 1.5, 0.5, 1)";
  inner.style.transform = "rotateX(-90deg)";
  setTimeout(function() {
    // swap content onto front
    if (isImage) {
      front.src = newValue;
    } else {
      front.innerText = newValue;
    }
    // reset instantly WITHOUT animation
    inner.style.transition = "none";
    inner.style.transform = "rotateX(0deg)";
  }, 550);
}
  
function formatWait(wait) {
  return wait < 10 ? "0" + wait : wait;
}

function getWaitColor(wait) {
  if (wait <= 10) return "#00c853";      // green
  if (wait <= 20) return "#64dd17";      // light green
  if (wait <= 35) return "#ffd600";      // yellow
  if (wait <= 55) return "#ff6d00";      // orange
  return "#d50000";                      // red (60+)
}
  
var firstRun = true;
function showNext() {
  if (rideList.length === 0) return;
  var attempts = 0;
  var ride;
  while (attempts < rideList.length) {
    ride = rideList[currentIndex];
    // skip closed rides
    if (ride.wait !== 999) {
      break;
    }
    currentIndex++;
    if (currentIndex >= rideList.length) {
      currentIndex = 0;
    }
    attempts++;
  }
  if (!ride || ride.wait === 999) return;
  var img = rideImages[ride.id] || "images/default.jpg";
  if (firstRun) {
    // set instantly, no animation
    document.querySelector("#nameFlip .flip-front").innerText = ride.name;
    document.querySelector("#landFlip .flip-front").innerText = ride.land;
    document.querySelector("#imageFlip .flip-front").src = img;
    var waitFront = document.querySelector("#waitFlip .flip-front");
    waitFront.innerText = formatWait(ride.wait);
    waitFront.style.color = getWaitColor(ride.wait);
    firstRun = false;
  } else {
    flipElement("nameFlip", ride.name);
    setTimeout(function() {
      flipElement("landFlip", ride.land);
    }, 100);
    setTimeout(function() {
      flipElement("imageFlip", img, true);
    }, 200);
    setTimeout(function() {
      flipElement("waitFlip", ride.wait);
    }, 300);
  }
  currentIndex++;
  if (currentIndex >= rideList.length) {
    currentIndex = 0;
  }
}

document.getElementById("dislikeButton").onclick = function() {
  var menu = document.getElementById("dislikeMenu");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
};
buildDislikeMenu();
  
// refresh data every minute
fetchTimes();
setInterval(fetchTimes, 60000);

// rotate display every 5 seconds
function startRotation() {
  showNext();

  setTimeout(startRotation, 5000);
}
setTimeout(startRotation, 1000);
