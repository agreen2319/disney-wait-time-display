<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Disney Ride Display</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #card {
      text-align: center;
      opacity: 1;
      transition: opacity 0.6s ease-in-out;
    }
    
    .fade-out {
      opacity: 0;
    }

    #name {
      font-size: 36px;
      margin-bottom: 10px;
    }

    #land {
      font-size: 20px;
      color: #ccc;
      margin-bottom: 10px;
    }

    #wait {
      font-size: 28px;
    }
  </style>
</head>

<body>

<div id="card">
  <div id="name">Loading...</div>
  <div id="land"></div>
  <div id="wait"></div>
</div>

<script>

// store rides
var rideList = [];
var currentIndex = 0;


// fetch all parks
function fetchTimes() {
  var urls = [
    "https://queue-times.com/parks/6/queue_times.json", // Magic Kingdom
    "https://queue-times.com/parks/7/queue_times.json", // Hollywood Studios
    "https://queue-times.com/parks/8/queue_times.json", // Animal Kingdom
    "https://queue-times.com/parks/5/queue_times.json", // EPCOT
    "https://queue-times.com/parks/16/queue_times.json", // Disneyland Park
    "https://queue-times.com/parks/17/queue_times.json" // California Adventure
  ];

  var results = [];
  var completed = 0;

  urls.forEach(function(url, index) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", proxy + encodeURIComponent(url), true);

    xhr.onload = function() {
      if (xhr.status === 200) {
        results[index] = JSON.parse(xhr.responseText);
      }

      completed++;

      if (completed === urls.length) {
        process(results);
      }
    };

    xhr.send();
  });
}


// build ordered list
function process(allData) {
  rideList = [];

  allData.forEach(function(data) {
    if (!data || !data.lands) return;

    data.lands.forEach(function(land) {
      land.rides.forEach(function(ride) {

        var mappedLand = rideToLand[ride.id];

        if (mappedLand) {
          rideList.push({
            name: ride.name,
            land: mappedLand,
            wait: ride.is_open ? ride.wait_time + " min" : "Closed"
          });
        }

      });
    });
  });
}


// display one ride
function showNext() {
  if (rideList.length === 0) return;

  var card = document.getElementById("card");

  // fade out
  card.classList.add("fade-out");

  setTimeout(function() {
    var ride = rideList[currentIndex];

    document.getElementById("name").innerText = ride.name;
    document.getElementById("land").innerText = ride.land;
    document.getElementById("wait").innerText = ride.wait;

    currentIndex++;
    if (currentIndex >= rideList.length) {
      currentIndex = 0;
    }

    // fade back in
    card.classList.remove("fade-out");

  }, 600); // match CSS transition
}


// refresh data every minute
fetchTimes();
setInterval(fetchTimes, 60000);

// rotate display every 5 seconds
function startRotation() {
  showNext();

  setTimeout(startRotation, 5000);
}
setTimeout(startRotation, 1000);

</script>

</body>
</html>
